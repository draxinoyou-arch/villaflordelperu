<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650" preserveAspectRatio="none">

<defs>

  <!-- Desenfoque de las hojas -->
  <filter id="blur">
    <feGaussianBlur stdDeviation="7"/>
  </filter>

  <!-- Sombra muy suave -->
  <filter id="shadow">
    <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
    <feOffset dy="8"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.18"/>
    </feComponentTransfer>
    <feMerge>
      <feMergeNode/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#587653"/>
    <stop offset="100%" stop-color="#879b78"/>
  </linearGradient>

</defs>


<!-- ================================================= -->
<!-- IZQUIERDA -->
<!-- ================================================= -->

<g opacity="0.30" filter="url(#blur)">

  <!-- tallo -->
  <path
    d="M -30 670
       C 35 590 70 500 92 405
       C 112 315 115 210 75 85"
    fill="none"
    stroke="#557451"
    stroke-width="13"
    stroke-linecap="round"/>


  <!-- hojas grandes -->
